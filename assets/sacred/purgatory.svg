<title id="title">Purgatory — purification toward Heaven</title><desc id="desc">Amber refining light becomes white and rises toward Heaven. A Catholic devotional interpretation of purification, distinct from Hell and not a literal description of a location.</desc><defs><radialGradient id="mercy"><stop stop-color="#fffbed" stop-opacity=".6"/><stop offset=".5" stop-color="#e4bb70" stop-opacity=".16"/><stop offset="1" stop-color="#e4bb70" stop-opacity="0"/></radialGradient><linearGradient id="cleanse" x2="0" y2="1"><stop stop-color="#fffef6" stop-opacity=".95"/><stop offset=".4" stop-color="#f0d39b" stop-opacity=".65"/><stop offset="1" stop-color="#b77b47" stop-opacity=".12"/></linearGradient></defs><ellipse cx="160" cy="117" rx="143" ry="113" fill="url(#mercy)"/><path d="M56 193q20-18 34-12t30-9 40-8 39 8 31 9 34 12" stroke="#d9b472" stroke-width="1.4" fill="none"/><ellipse cx="160" cy="193" rx="104" ry="23" fill="#bf9553" fill-opacity=".07" stroke="#d9b472" stroke-opacity=".45"/><ellipse cx="160" cy="193" rx="78" ry="15" fill="none" stroke="#ebd297" stroke-opacity=".35"/><path d="M79 190q8-42 35-73-12 29 7 47-1-71 40-130-9 68 13 113 1-46 20-66-4 70 44 109-76 32-159 0Z" fill="url(#cleanse)"/><path d="M131 180q-11-49 30-119-8 74 29 119" fill="#fffceb" fill-opacity=".38"/><path d="M116 83q-16-32 9-49M203 83q16-32-9-49" stroke="#fff0c6" stroke-opacity=".4" fill="none"/><path d="M147 28l13-13 13 13M160 16v27" stroke="#fffbea" stroke-opacity=".9" stroke-width="1.4" fill="none"/><circle cx="116" cy="106" r="1.5" fill="#fff4d3" opacity=".8"/><circle cx="215" cy="119" r="1.5" fill="#fff4d3" opacity=".8"/><circle cx="160" cy="50" r="1.5" fill="#fff4d3" opacity=".8"/><circle cx="102" cy="149" r="1.5" fill="#fff4d3" opacity=".8"/><circle cx="206" cy="155" r="1.5" fill="#fff4d3" opacity=".8"/></svg>
